<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#072641"/>
      <stop offset="55%" stop-color="#0a2e4a"/>
      <stop offset="100%" stop-color="#08243b"/>
    </linearGradient>
    <radialGradient id="oceanGlowA" cx="18%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#2d6b97" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#2d6b97" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oceanGlowB" cx="82%" cy="70%" r="44%">
      <stop offset="0%" stop-color="#2a628f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2a628f" stop-opacity="0"/>
    </radialGradient>
    <filter id="landShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .coastline { stroke: #d7e3ec; stroke-opacity: 0.26; stroke-width: 2.2; fill-opacity: 0.24; }
      .atlas { fill: #2f86d5; stroke: #8fd4ff; }
      .meridian { fill: #c74242; stroke: #ff9da1; }
      .concordat { fill: #d9b83f; stroke: #ffe78c; }
      .neutral { fill: #a9aba7; stroke: #dfe4dc; }
      .province { stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; filter: url(#landShadow); }
      .route { fill: none; stroke: #9fb8c9; stroke-width: 2; stroke-dasharray: 8 10; opacity: 0.45; }
      .node circle { fill: rgba(10, 40, 62, 0.94); stroke: #c8dae8; stroke-width: 1.8; }
      .node text { fill: #f1f7fc; font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .node-label { fill: #d2dfeb; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="url(#oceanGrad)"/>
  <rect x="0" y="0" width="1200" height="720" fill="url(#oceanGlowA)"/>
  <rect x="0" y="0" width="1200" height="720" fill="url(#oceanGlowB)"/>

  <!-- Landmass silhouettes -->
  <path class="coastline atlas" d="M86 108 C176 70 312 78 372 146 C410 214 412 326 384 420 C350 520 280 586 176 596 C98 596 56 558 40 490 C24 420 26 300 40 212 C50 162 64 126 86 108 Z"/>
